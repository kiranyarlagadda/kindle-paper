<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How the paper and the morning page get built and delivered</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .device { fill: #f6f8fa; stroke: #1f2328; stroke-width: 2.5; }
    .group { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .title { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .text { fill: #57606a; font-size: 13px; }
    .label { fill: #57606a; font-size: 12px; font-style: italic; }
    .caps { fill: #57606a; font-size: 12px; font-weight: 600; letter-spacing: 1.5px; }
    .line { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .dash { stroke: #57606a; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box, .device { fill: #161b22; }
      .box { stroke: #8b949e; }
      .device { stroke: #e6edf3; }
      .group { stroke: #6e7681; }
      .title { fill: #e6edf3; }
      .text, .label, .caps { fill: #9198a1; }
      .line, .dash { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1040" height="500"/>

  <!-- Inputs -->
  <rect class="box" x="20" y="30" width="240" height="70" rx="8"/>
  <text class="title" x="36" y="58">Phone</text>
  <text class="text" x="36" y="80">Home Assistant app</text>

  <rect class="box" x="20" y="140" width="240" height="70" rx="8"/>
  <text class="title" x="36" y="168">Home Assistant</text>
  <text class="text" x="36" y="190">LAN only, phone location</text>

  <rect class="box" x="20" y="250" width="240" height="94" rx="8"/>
  <text class="title" x="36" y="278">Public sources</text>
  <text class="text" x="36" y="300">News feeds, ESPN, Yahoo</text>
  <text class="text" x="36" y="320">Open-Meteo, OpenStreetMap</text>

  <rect class="box" x="20" y="384" width="240" height="86" rx="8"/>
  <text class="title" x="36" y="412">GPU box (optional)</text>
  <text class="text" x="36" y="434">Qwen3.8-27B behind LiteLLM</text>
  <text class="text" x="36" y="454">every call has a fallback</text>

  <path class="line" d="M140,100 L140,138" marker-end="url(#arrow)"/>

  <!-- Inputs into paper.py: three straight lines that never cross -->
  <path class="line" d="M260,175 L346,96" marker-end="url(#arrow)"/>
  <path class="line" d="M260,297 L346,112" marker-end="url(#arrow)"/>
  <path class="line" d="M260,427 L346,128" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Mac mini -->
  <rect class="group" x="330" y="14" width="370" height="470" rx="12"/>
  <text class="caps" x="348" y="38">MAC MINI</text>

  <rect class="box" x="348" y="54" width="162" height="96" rx="8"/>
  <text class="title" x="362" y="80">paper.py</text>
  <text class="text" x="362" y="102">05:15 daily</text>
  <text class="text" x="362" y="122">sections, summaries,</text>
  <text class="text" x="362" y="140">EPUB3 by hand</text>

  <rect class="box" x="522" y="54" width="162" height="96" rx="8"/>
  <text class="title" x="536" y="80">kindle.py</text>
  <text class="text" x="536" y="102">05:30 daily</text>
  <text class="text" x="536" y="122">headless Chrome,</text>
  <text class="text" x="536" y="140">1236x1648 gray</text>

  <path class="line" d="M429,150 L429,196" marker-end="url(#arrow)"/>
  <path class="line" d="M603,150 L603,196" marker-end="url(#arrow)"/>

  <rect class="box" x="348" y="198" width="336" height="70" rx="8"/>
  <text class="title" x="362" y="226">out/</text>
  <text class="text" x="362" y="248">7 days of editions, kindle.png, power log</text>

  <path class="line" d="M516,268 L516,306" marker-end="url(#arrow)"/>

  <rect class="box" x="348" y="308" width="336" height="160" rx="8"/>
  <text class="title" x="362" y="336">brain_api.py</text>
  <text class="text" x="362" y="358">stdlib HTTP server, token and</text>
  <text class="text" x="362" y="376">private-address check</text>
  <text class="text" x="362" y="404">/paper/editions.json</text>
  <text class="text" x="362" y="422">/paper/DATE.epub  /kindle.png</text>
  <text class="text" x="362" y="440">/paper/tzfile  POST /kindle/log</text>

  <!-- Delivery -->
  <path class="line" d="M684,360 L814,300" marker-end="url(#arrow)"/>
  <text class="label" x="712" y="312">over Tailscale</text>
  <path class="dash" d="M814,400 L688,430" marker-end="url(#arrow)"/>
  <text class="label" x="722" y="448">morning log</text>

  <!-- Kindle -->
  <rect class="device" x="816" y="120" width="204" height="330" rx="18"/>
  <text class="title" x="834" y="152">Kindle, KOReader</text>
  <text class="text" x="834" y="180">boot.sh at startup</text>
  <text class="text" x="834" y="206">power-events.sh</text>
  <text class="text" x="848" y="224">05:45 wake, sync, sleep</text>
  <text class="text" x="834" y="250">sync.sh</text>
  <text class="text" x="848" y="268">editions, image, zone</text>
  <path class="line" d="M834,290 L1002,290"/>
  <text class="text" x="834" y="316">Sleep screen:</text>
  <text class="text" x="848" y="334">the morning page</text>
  <text class="text" x="834" y="360">Newspaper folder:</text>
  <text class="text" x="848" y="378">last 7 days</text>
  <text class="text" x="834" y="404">Tailscale,</text>
  <text class="text" x="848" y="422">userspace mode</text>
</svg>
