<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How the paper and the morning page get built and delivered</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .grp { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .dev { fill: #f6f8fa; stroke: #1f2328; stroke-width: 2.5; }
    .t { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .s { fill: #57606a; font-size: 12.5px; }
    .lbl { fill: #57606a; font-size: 12px; font-style: italic; }
    .gl { fill: #57606a; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .ln { fill: none; stroke: #57606a; stroke-width: 1.6; }
    .dash { stroke-dasharray: 5 4; }
    .ah { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box, .dev { fill: #161b22; }
      .box { stroke: #8b949e; }
      .dev { stroke: #e6edf3; }
      .grp { stroke: #6e7681; }
      .t { fill: #e6edf3; }
      .s, .lbl, .gl { fill: #9198a1; }
      .ln { stroke: #9198a1; }
      .ah { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="580" rx="10"/>

  <!-- Inputs -->
  <rect class="box" x="24" y="36" width="210" height="62" rx="8"/>
  <text class="t" x="40" y="62">Phone</text>
  <text class="s" x="40" y="82">Home Assistant app, location only</text>

  <rect class="box" x="24" y="140" width="210" height="62" rx="8"/>
  <text class="t" x="40" y="166">Home Assistant</text>
  <text class="s" x="40" y="186">LAN only, read with a token</text>

  <rect class="box" x="24" y="244" width="210" height="112" rx="8"/>
  <text class="t" x="40" y="270">Public sources</text>
  <text class="s" x="40" y="292">News feeds, ESPN, Yahoo</text>
  <text class="s" x="40" y="311">Open-Meteo (weather, zone)</text>
  <text class="s" x="40" y="330">OpenStreetMap (place names)</text>

  <rect class="box" x="24" y="414" width="210" height="80" rx="8"/>
  <text class="t" x="40" y="440">GPU box</text>
  <text class="s" x="40" y="460">Qwen3.8-27B behind LiteLLM</text>
  <text class="s" x="40" y="479">optional, every call has a fallback</text>

  <!-- Server -->
  <rect class="grp" x="296" y="20" width="356" height="540" rx="12"/>
  <text class="gl" x="316" y="46">MAC MINI</text>

  <rect class="box" x="316" y="66" width="316" height="72" rx="8"/>
  <text class="t" x="332" y="92">paper.py, 05:15</text>
  <text class="s" x="332" y="113">sections, model picks and summaries,</text>
  <text class="s" x="332" y="130">EPUB3 zipped by hand</text>

  <rect class="box" x="316" y="186" width="316" height="72" rx="8"/>
  <text class="t" x="332" y="212">kindle.py + headless Chrome, 05:30</text>
  <text class="s" x="332" y="233">one page at 1236x1648,</text>
  <text class="s" x="332" y="250">sips to 8-bit gray</text>

  <rect class="box" x="316" y="306" width="316" height="62" rx="8"/>
  <text class="t" x="332" y="332">out/</text>
  <text class="s" x="332" y="352">7 days of editions, kindle.png, power log</text>

  <rect class="box" x="316" y="416" width="316" height="122" rx="8"/>
  <text class="t" x="332" y="442">brain_api.py</text>
  <text class="s" x="332" y="463">stdlib HTTP server, token plus</text>
  <text class="s" x="332" y="480">private-address check</text>
  <text class="s" x="332" y="502">/paper/editions.json  /paper/DATE.epub</text>
  <text class="s" x="332" y="520">/kindle.png  /paper/tzfile  /kindle/log</text>

  <!-- Device -->
  <rect class="dev" x="724" y="150" width="232" height="300" rx="22"/>
  <text class="t" x="744" y="184">Kindle, KOReader</text>
  <text class="s" x="744" y="214">boot.sh at startup</text>
  <text class="s" x="744" y="236">power-events.sh</text>
  <text class="s" x="756" y="254">05:45 wake, sync, sleep</text>
  <text class="s" x="744" y="276">sync.sh</text>
  <text class="s" x="756" y="294">editions, image, time zone</text>
  <line class="ln" x1="744" y1="314" x2="936" y2="314"/>
  <text class="s" x="744" y="338">Sleep screen: the morning page</text>
  <text class="s" x="744" y="358">Newspaper folder: last 7 days</text>
  <text class="s" x="744" y="378">Tailscale, userspace mode</text>

  <!-- Arrows -->
  <path class="ln" d="M129 98V138" marker-end="url(#a)"/>
  <path class="ln" d="M234 171H270V102H314" marker-end="url(#a)"/>
  <text class="lbl" x="264" y="134" text-anchor="end">location</text>
  <path class="ln" d="M270 171V222H314" marker-end="url(#a)"/>
  <path class="ln" d="M234 301H284V118H314" marker-end="url(#a)"/>
  <path class="ln" d="M284 240H314" marker-end="url(#a)"/>
  <path class="ln" d="M234 454H292V130H314" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M474 138V304" marker-end="url(#a)"/>
  <path class="ln" d="M520 258V304" marker-end="url(#a)"/>
  <path class="ln" d="M474 368V414" marker-end="url(#a)"/>
  <path class="ln" d="M632 450H690V260H722" marker-end="url(#a)"/>
  <text class="lbl" x="654" y="244" text-anchor="start">tailnet</text>
  <path class="ln dash" d="M840 450V500H634" marker-end="url(#a)"/>
  <text class="lbl" x="660" y="520">morning log, POST /kindle/log</text>
</svg>
